<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAMS - Session Completion</title>
    <link rel="stylesheet" href="css/student-dashboard.css">
    <link rel="stylesheet" href="css/student-completion.css">
    <link rel="stylesheet" href="css/notifications.css">
</head>
<body>

<div class="app">

    <!-- ============================================
         SIDEBAR
    ============================================ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="#ffffff">
                    <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"/>
                </svg>
            </div>
            <div class="brand-text">
                <div class="brand-title">SEAMS</div>
                <div class="brand-sub">Mabini Integrated School</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="student-dashboard.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
                Dashboard
            </a>
            <a href="student-event.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                Events
            </a>
            <a href="student-registrations.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 11l3 3L22 4"/>
                    <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                </svg>
                Registrations
            </a>
            <a href="student-attendance.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 11 12 14 22 4"/>
                    <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                </svg>
                Attendance
            </a>
            <a href="student-completion.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                </svg>
                Complete
            </a>
            <a href="student-history.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                History
            </a>
            <a href="student-profile.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21v-1a6 6 0 016-6h4a6 6 0 016 6v1"/>
                </svg>
                Profile
            </a>
            <a href="index.html" class="nav-item" onclick="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Logout
            </a>
        </nav>

        <div class="sidebar-user">
            <div class="user-avatar" id="sideAvatar">JD</div>
            <div class="user-info">
                <div class="user-name" id="sideName">Juan Dela Cruz</div>
                <div class="user-role" id="sideRole">Student</div>
            </div>
        </div>
    </aside>

    <!-- ============================================
         MAIN
    ============================================ -->
    <main class="main">

        <header class="topbar">
            <div class="search-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" placeholder="Search events..." class="search-input">
            </div>

            <div class="topbar-right">
                <button class="icon-btn" title="Notifications">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 01-3.46 0"/>
                    </svg>
                    <span class="badge">3</span>
                </button>

                <div class="topbar-user">
                    <div class="user-avatar small" id="topAvatar">JD</div>
                    <span class="topbar-name" id="topName">Juan</span>
                </div>
            </div>
        </header>

        <div class="content">

            <!-- Page header -->
            <div class="page-header">
                <h1 class="page-title">Session Complete</h1>
                <p class="page-sub">Complete every session of an event to earn full participation.</p>
            </div>

            <!-- Completion cards grid -->
            <section class="completion-grid" id="completionGrid">
                <!-- Cards injected by js/completion.js -->
            </section>

        </div>
    </main>

</div>

<script type="module" src="js/completion.js"></script>
<script type="module" src="js/notifications.js"></script>
</body>
</html>
