<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEAMS - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f5f2ed; color: #1e293b; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="bg-white/80 border border-stone-200 rounded-2xl p-8 max-w-md w-full shadow-lg text-center space-y-6">
    <div class="w-14 h-14 bg-[#c89228] text-slate-900 rounded-2xl flex items-center justify-center text-2xl font-bold mx-auto shadow-sm">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    
    <div>
      <h1 class="font-serif text-2xl font-bold text-[#0c221a]">Sign in to SEAMS</h1>
      <p class="text-xs text-slate-500 mt-1">Mabini Integrated School Management Portal</p>
    </div>

    <form class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
        <input type="email" placeholder="coordinator@mabini.edu.ph" class="w-full p-2.5 rounded-lg border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0c221a]">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
        <input type="password" placeholder="••••••••" class="w-full p-2.5 rounded-lg border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0c221a]">
      </div>
      <a href="events.html" class="w-full py-2.5 bg-[#0c221a] text-white rounded-lg font-semibold text-sm hover:bg-[#18392d] transition block text-center shadow-sm">
        Log In
      </a>
    </form>
  </div>

</body>
</html>
